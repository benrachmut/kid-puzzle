<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Puzzle Play">
  <!-- The app icon, drawn rather than photographed so the whole game still ships
       with no binary asset that needs a licence or an optimiser: a puzzle piece
       (the game) whose middle is a camera lens (the child's own pictures). The
       background bleeds to every edge so the same artwork also works masked. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <g fill="#6366f1">
    <rect x="128" y="150" width="256" height="256" rx="44"/>
    <circle cx="256" cy="150" r="52"/>
    <circle cx="384" cy="278" r="52"/>
  </g>

  <circle cx="256" cy="278" r="66" fill="#ffffff"/>
  <circle cx="256" cy="278" r="34" fill="#4338ca"/>
  <circle cx="234" cy="256" r="11" fill="#ffffff" opacity="0.85"/>
</svg>
