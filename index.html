<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#6366f1">
  <title>Puzzle Play</title>
  <!-- Every path here is relative on purpose: the same files are opened from
       file://, served from localhost, and published under /kid-puzzle/ on
       GitHub Pages, and an absolute path would break two of those three. -->
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="btn-back" class="btn btn--icon" type="button" data-i18n-aria="ui.back" hidden></button>
      <h1 class="topbar__title" data-i18n="app.title"></h1>
      <div class="topbar__spacer"></div>
      <button id="btn-sound" class="btn btn--icon" type="button" data-i18n-aria="ui.soundOn"></button>
      <button id="btn-lang" class="btn btn--lang" type="button" data-i18n-aria="ui.langToggleAria">
        <span id="btn-lang-icon" class="btn__glyph"></span>
        <span data-i18n="ui.langToggle"></span>
      </button>
    </header>

    <section id="screen-home" class="screen" aria-labelledby="home-heading">
      <p id="home-heading" class="screen__heading" data-i18n="app.subtitle"></p>
      <div id="home-grid" class="card-grid"></div>
    </section>

    <section id="screen-photos" class="screen" aria-labelledby="photos-heading">
      <p id="photos-heading" class="screen__heading" data-i18n="photos.heading"></p>

      <div class="photo-actions">
        <!-- A label wrapping the input is what makes the whole big tile tappable.
             The input keeps its own focus ring (see .photo-btn:focus-within) so
             it is still reachable from a keyboard. -->
        <label class="btn photo-btn">
          <span id="glyph-take" class="photo-btn__glyph"></span>
          <span class="photo-btn__text" data-i18n="photos.take"></span>
          <!-- capture=environment asks the phone for the back camera directly;
               on a desktop it degrades to an ordinary file picker. -->
          <input id="input-take" class="photo-btn__input" type="file" accept="image/*" capture="environment">
        </label>
        <label class="btn photo-btn">
          <span id="glyph-pick" class="photo-btn__glyph"></span>
          <span class="photo-btn__text" data-i18n="photos.pick"></span>
          <input id="input-pick" class="photo-btn__input" type="file" accept="image/*">
        </label>
      </div>

      <p id="photo-working" class="photo-note" data-i18n="photos.working" hidden></p>
      <p id="photo-error" class="photo-note photo-note--bad" data-i18n="photos.badFile" hidden></p>
      <p id="photo-hint" class="photo-note photo-note--hint" data-i18n="photos.notKept" hidden></p>

      <div id="photo-grid" class="photo-grid"></div>
    </section>

    <section id="screen-photo-game" class="screen" aria-labelledby="photo-game-heading">
      <p id="photo-game-heading" class="screen__heading" data-i18n="photos.chooseGame"></p>
      <div id="photo-game-grid" class="card-grid"></div>
    </section>

    <section id="screen-levels" class="screen" aria-labelledby="levels-heading">
      <p id="levels-heading" class="screen__heading" data-i18n="ui.chooseLevel"></p>
      <div id="level-grid" class="level-grid"></div>
    </section>

    <section id="screen-game" class="screen">
      <div id="game-mount" class="game-mount"></div>
    </section>
  </div>

  <div id="overlay-win" class="overlay" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="overlay__panel">
      <h2 id="win-title" class="overlay__title" data-i18n="win.title"></h2>
      <div id="win-stars" class="stars stars--big"></div>
      <div class="overlay__actions">
        <button id="btn-home" class="btn btn--icon" type="button" data-i18n-aria="ui.home"></button>
        <button id="btn-replay" class="btn btn--icon" type="button" data-i18n-aria="ui.replay"></button>
        <button id="btn-next" class="btn btn--big" type="button" data-i18n-aria="ui.next"><span data-i18n="ui.next"></span></button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/util.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/art.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/games/jigsaw.js"></script>
  <script src="js/games/matching.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/slide.js"></script>
  <script src="js/games/sequence.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* Offline support is strictly an upgrade: file:// has no service worker and
       neither has an insecure origin, and the game has to keep working in both,
       so a failure here is swallowed rather than shown. */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' })['catch'](function () {});
      });
    }
  </script>
</body>
</html>
